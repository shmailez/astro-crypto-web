      const A = Math.floor(y / 100);
      const B = 2 - A + Math.floor(A / 4);
      return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + h / 24 + B - 1524.5;

    // Решение уравнения Кеплера M = E - e*sin(E) методом Ньютона
    function solveKepler(Mdeg, e) {
      let E = Mdeg * D2R;
      const M = E;
      for (let k = 0; k < 10; k++) {
        E = E - (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
      }
      return E;
    }

    // Гелиоцентрические координаты (эклиптика J2000), а.е.
    function heliocentric(el, T) {
      const e = el.e + el.de * T;
      const I = (el.I + el.dI * T) * D2R;
      const L = el.L + el.dL * T;
      const P = el.P + el.dP * T;
      const N = (el.N + el.dN * T) * D2R;
      const M = norm360(L - P);
      const E = solveKepler(M, e);
      const xp = el.a * (Math.cos(E) - e);
      const yp = el.a * Math.sqrt(1 - e * e) * Math.sin(E);
      const w = (P - (el.N + el.dN * T)) * D2R;
      const cw = Math.cos(w), sw = Math.sin(w);
      const cN = Math.cos(N), sN = Math.sin(N);
      const cI = Math.cos(I), sI = Math.sin(I);
      return {
        x: (cN * cw - sN * sw * cI) * xp + (-cN * sw - sN * cw * cI) * yp,
        y: (sN * cw + cN * sw * cI) * xp + (-sN * sw + cN * cw * cI) * yp,
        z: (sw * sI) * xp + (cw * sI) * yp
      };
    }

    // Луна: низкоточная теория (П. Шлятер) с главными возмущениями
    function moonLongitude(d) {
      const N = norm360(125.1228 - 0.0529538083 * d);
      const i = 5.1454;
      const w = norm360(318.0634 + 0.1643573223 * d);
      const e = 0.054900;
      const M = norm360(115.3654 + 13.0649929509 * d);

      const E = solveKepler(M, e);
      const xv = Math.cos(E) - e;
      const yv = Math.sqrt(1 - e * e) * Math.sin(E);
      const v = Math.atan2(yv, xv);
      const r = Math.sqrt(xv * xv + yv * yv);

      const u = v + w * D2R; // аргумент широты: истинная аномалия + аргумент перигея
      const nr = N * D2R, ir = i * D2R;
      const xh = r * (Math.cos(nr) * Math.cos(u) - Math.sin(nr) * Math.sin(u) * Math.cos(ir));
      const yh = r * (Math.sin(nr) * Math.cos(u) + Math.cos(nr) * Math.sin(u) * Math.cos(ir));
      let lon = Math.atan2(yh, xh) / D2R;

      // Главные возмущения
      const Ms = norm360(356.0470 + 0.9856002585 * d);
      const ws = norm360(282.9404 + 0.0000470935 * d);
      const Lm = norm360(N + w + M);
      const D = norm360(Lm - norm360(ws + Ms));
      const F = norm360(Lm - N);

      lon += -1.274 * sinD(M - 2 * D)
             + 0.658 * sinD(2 * D)
             - 0.186 * sinD(Ms)
             - 0.059 * sinD(2 * M - 2 * D)
             - 0.057 * sinD(M - 2 * D + Ms)
             + 0.053 * sinD(M + 2 * D)
             + 0.046 * sinD(2 * D - Ms)
             + 0.041 * sinD(M - Ms)
             - 0.035 * sinD(D)
             - 0.031 * sinD(M + Ms)
             - 0.015 * sinD(2 * F - 2 * D)
             + 0.011 * sinD(M - 4 * D);

      return norm360(lon);
    }

    // Геоцентрические долготы всех тел (равноденствие даты)
    function getPlanetaryLongitudes(d) {
      const T = d / 36525.0;
      // Общая прецессия: перевод J2000 -> равноденствие даты
      const precession = 5029.0966 * T / 3600.0;

      const earth = heliocentric(ORBITAL_ELEMENTS.earth, T);

      const geoLon = (key) => {
        const h = heliocentric(ORBITAL_ELEMENTS[key], T);
        return norm360(Math.atan2(h.y - earth.y, h.x - earth.x) / D2R + precession);
      };

      return {
        sun:     norm360(Math.atan2(-earth.y, -earth.x) / D2R + precession),
        // Элементы Шлятера заданы на эпоху 2000 Jan 0.0 (JD 2451543.5) — поэтому d + 1.5
        moon:    moonLongitude(d + 1.5),
        mercury: geoLon('mercury'),
        venus:   geoLon('venus'),
        mars:    geoLon('mars'),
        jupiter: geoLon('jupiter'),
        saturn:  geoLon('saturn'),
        uranus:  geoLon('uranus'),
        neptune: geoLon('neptune'),
        pluto:   geoLon('pluto')
      };
    }

    // Convert absolute longitude to zodiac breakdown
    function formatZodiac(longitude) {
      const norm = norm360(longitude);
      const signIndex = Math.floor(norm / 30);
      const degInSign = norm % 30;
      const deg = Math.floor(degInSign);
      const min = Math.floor((degInSign - deg) * 60);

      return {
        sign: ZODIAC_SIGNS[signIndex],
        degrees: deg,
        minutes: min,
        raw: norm
      };
    }

    /* =========================================================================
       UI & SVG RENDERING LOGIC
       ========================================================================= */

    function renderNatalChartSVG(planetResults) {
      const svg = document.getElementById('natal-chart-svg');
      const cx = 200, cy = 200, rOuter = 180, rInner = 140, rPlanet = 115;
      let svgHtml = '';

      // Outer Zodiac Ring Background
      svgHtml += `<circle cx="${cx}" cy="${cy}" r="${rOuter}" fill="none" stroke="#3730A3" stroke-width="2"/>`;
      svgHtml += `<circle cx="${cx}" cy="${cy}" r="${rInner}" fill="rgba(15, 12, 41, 0.8)" stroke="#4338CA" stroke-width="1.5"/>`;

      // Render 12 Zodiac Segments
      ZODIAC_SIGNS.forEach((sign, i) => {
        const startAngle = (i * 30 - 90) * Math.PI / 180;
        const endAngle = ((i + 1) * 30 - 90) * Math.PI / 180;
        const midAngle = ((i + 0.5) * 30 - 90) * Math.PI / 180;

        // Divider lines
        const x1 = cx + rInner * Math.cos(startAngle);
        const y1 = cy + rInner * Math.sin(startAngle);
        const x2 = cx + rOuter * Math.cos(startAngle);
        const y2 = cy + rOuter * Math.sin(startAngle);
        svgHtml += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#4338CA" stroke-width="1" />`;

        // Zodiac Symbol Text
        const tx = cx + (rInner + 20) * Math.cos(midAngle);
        const ty = cy + (rInner + 20) * Math.sin(midAngle) + 5;
        svgHtml += `<text x="${tx}" y="${ty}" font-size="16" fill="${sign.color}" text-anchor="middle" font-weight="bold">${sign.symbol}</text>`;
      });

      // Render Planetary Positions & Aspect Markers
      planetResults.forEach((p) => {
        const angle = (p.raw - 90) * Math.PI / 180;
        const px = cx + rPlanet * Math.cos(angle);
        const py = cy + rPlanet * Math.sin(angle) + 4;

        // Line from inner circle to planet
        const ix = cx + rInner * Math.cos(angle);
        const iy = cy + rInner * Math.sin(angle);
        svgHtml += `<line x1="${ix}" y1="${iy}" x2="${px}" y2="${py}" stroke="${p.meta.color}" stroke-dasharray="2,2" stroke-width="1"/>`;

        // Planet Symbol
        svgHtml += `<text x="${px}" y="${py}" font-size="18" fill="${p.meta.color}" font-weight="bold" text-anchor="middle" class="drop-shadow-sm">${p.meta.symbol}</text>`;
      });

      // Aspect lines across chart (Center connects)
      for (let i = 0; i < planetResults.length; i++) {
        for (let j = i + 1; j < planetResults.length; j++) {
          const p1 = planetResults[i];
          const p2 = planetResults[j];
          const diff = Math.abs(p1.raw - p2.raw);
          const aspectDiff = Math.min(diff, 360 - diff);

          // Major aspects: Conjunction (0), Opposition (180), Trine (120), Square (90)
          let aspectColor = null;
          if (aspectDiff >= 115 && aspectDiff <= 125) aspectColor = 'rgba(16, 185, 129, 0.4)'; // Trine (Green)
          else if (aspectDiff >= 85 && aspectDiff <= 95) aspectColor = 'rgba(239, 68, 68, 0.4)'; // Square (Red)
          else if (aspectDiff >= 175 && aspectDiff <= 185) aspectColor = 'rgba(245, 158, 11, 0.4)'; // Opposition (Orange)

          if (aspectColor) {
            const a1 = (p1.raw - 90) * Math.PI / 180;
            const a2 = (p2.raw - 90) * Math.PI / 180;
            const x1 = cx + (rPlanet - 15) * Math.cos(a1);
            const y1 = cy + (rPlanet - 15) * Math.sin(a1);
            const x2 = cx + (rPlanet - 15) * Math.cos(a2);
            const y2 = cy + (rPlanet - 15) * Math.sin(a2);
            svgHtml += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${aspectColor}" stroke-width="1.2"/>`;
          }
        }
      }

      // Center decorative ring
      svgHtml += `<circle cx="${cx}" cy="${cy}" r="25" fill="#14122B" stroke="#6366F1" stroke-width="1"/>`;
      svgHtml += `<circle cx="${cx}" cy="${cy}" r="3" fill="#A855F7"/>`;

      svg.innerHTML = svgHtml;
    }

    /* =========================================================================
       ТРАНЗИТЫ: текущее небо vs натальная карта
       ========================================================================= */
    const ASPECT_DEFS = [
      { key: 'conj', symbol: '\u260C', angle: 0,   color: '#A855F7' },
      { key: 'opp',  symbol: '\u260D', angle: 180, color: '#F59E0B' },
      { key: 'sq',   symbol: '\u25A1', angle: 90,  color: '#EF4444' },
      { key: 'tri',  symbol: '\u25B3', angle: 120, color: '#10B981' }
    ];
    const TRANSIT_ORB = 3.0; // градусы

    // Что затрагивает аспект (натальная планета)
    const NATAL_NUANCE = {
      sun: 'идентичность и курс монеты', moon: 'настроение и «толпа» сообщества',
      mercury: 'новости, код и инфраструктура', venus: 'деньги и ликвидность',
      mars: 'движение цены и волатильность', jupiter: 'рост, листинги и инвесторы',
      saturn: 'структура и долгосрочные тренды', uranus: 'технологии и неожиданные повороты',
      neptune: 'хайп, идеология и иллюзии', pluto: 'власть, капитал и трансформации'
    };

    const TRANSIT_WEIGHT = {
      pluto: 0, neptune: 1, uranus: 2, saturn: 3, jupiter: 4,
      mars: 5, sun: 6, venus: 7, mercury: 8, moon: 9
    };

    // Текущее небо + статус ретроградности (сравнение с позициями сутки назад)
    function getCurrentSky() {
      const now = new Date();
      const jd = getJulianDay(now.getFullYear(), now.getMonth() + 1, now.getDate(),
                             now.getHours() + now.getMinutes() / 60);
      const d = jd - 2451545.0;
      const lons = getPlanetaryLongitudes(d);
      const lonsPrev = getPlanetaryLongitudes(d - 1);
      return PLANET_METADATA.map(meta => ({
        meta,
        lon: lons[meta.id],
        retro: meta.id !== 'sun' && meta.id !== 'moon' &&
               norm360(lons[meta.id] - lonsPrev[meta.id]) > 180
      }));
    }

    function moonPhaseName(elong) {
      const phases = [
        [22.5, 'moon.new'], [67.5, 'moon.waxCrescent'],
        [112.5, 'moon.firstQuarter'], [157.5, 'moon.waxGibbous'],
        [202.5, 'moon.full'], [247.5, 'moon.wanGibbous'],
        [292.5, 'moon.lastQuarter'], [337.5, 'moon.wanCrescent']
      ];
      for (const [limit, key] of phases) if (elong < limit) return t(key);
      return t('moon.new');
    }

    function renderTransits(natalResults, natalLabel) {
      const sky = getCurrentSky();
      document.getElementById('transit-sub').textContent =
        natalLabel + ' \u00B7 ' + t('ui.nowNote');

      // --- Чипы: фаза Луны + ретроградные планеты ---
      const sunLon = sky.find(p => p.meta.id === 'sun').lon;
      const moonLon = sky.find(p => p.meta.id === 'moon').lon;
      const elong = norm360(moonLon - sunLon);
      const illum = (1 - Math.cos(elong * D2R)) / 2;
      const retro = sky.filter(p => p.retro).map(p => t(p.meta.key));

      const chip = (txt, color) =>
        `<span class="px-2.5 py-1 rounded-full border text-[10px] font-medium" style="border-color:${color}44;color:${color};background:${color}11">${txt}</span>`;
      document.getElementById('transit-chips').innerHTML =
        chip(`${moonPhaseName(elong)} \u00B7 ${t('ui.illum')} ${Math.round(illum * 100)}%`, '#E2E8F0') +
        (retro.length
          ? chip(`\u21A9 ${t('ui.retro')}: ${retro.join(', ')}`, '#F59E0B')
          : chip(t('ui.allDirect'), '#10B981'));

      // --- Активные аспекты транзит -> натал ---
      const hits = [];
      sky.forEach(t => natalResults.forEach(n => {
        const dist = norm360(t.lon - n.raw);
        const diff = Math.min(dist, 360 - dist);
        ASPECT_DEFS.forEach(a => {
          const orb = Math.abs(diff - a.angle);
          if (orb <= TRANSIT_ORB) hits.push({ t, n, a, orb });
        });
      }));

      hits.sort((x, y) => TRANSIT_WEIGHT[x.t.meta.id] - TRANSIT_WEIGHT[y.t.meta.id] || x.orb - y.orb);

      const list = document.getElementById('transit-list');
      if (!hits.length) {
        list.innerHTML = `<p class="text-[11px] text-gray-500 py-2">${t('ui.noTransits')}</p>`;
        return;
      }

      // Этап 4, Progressive Disclosure: по умолчанию видны первые 3 транзита,
      // остальные раскрываются кнопкой «Показать еще (+N)» без ухода с экрана
      const COLLAPSED_COUNT = 3;
      const renderHit = h => `
        <div class="bg-slate-900/60 border rounded-xl p-3" style="border-color:${h.a.color}33">
          <div class="flex items-center justify-between mb-1">
            <span class="text-xs font-bold">
              <span style="color:${h.t.meta.color}">${t(h.t.meta.key)}${h.t.retro ? ' \u211E' : ''}</span>
              <span style="color:${h.a.color}"> ${h.a.symbol} ${t('aspect.' + h.a.key)} </span>
              <span style="color:${h.n.meta.color}">${t(h.n.meta.key)}</span>
            </span>
            <span class="text-[10px] text-gray-500 shrink-0 ml-2">${t('ui.orb')} ${h.orb.toFixed(1)}\u00B0 \u00B7 ${t('dur.' + h.t.meta.id)}</span>
          </div>
          <p class="text-[11px] text-gray-300 leading-snug">${t('tone.' + h.t.meta.id + '.' + h.a.key)} \u2014 ${t('nuance.' + h.n.meta.id)}.</p>
        </div>`;

      let expanded = false;
      const drawList = () => {
        const limit = expanded ? hits.length : Math.min(COLLAPSED_COUNT, hits.length);
        list.innerHTML = hits.slice(0, limit).map(renderHit).join('');
        if (hits.length > COLLAPSED_COUNT) {
          const more = document.createElement('button');
          more.className = 'w-full py-2.5 rounded-xl border text-xs font-semibold transition-all active:scale-[0.98]';
          more.style.cssText = 'border-color:rgba(0,230,118,0.35);color:#00E676;background:rgba(0,230,118,0.06)';
          more.textContent = expanded
            ? t('ui.showLess')
            : `${t('ui.showMore')} (+${hits.length - COLLAPSED_COUNT})`;
          more.addEventListener('click', () => { expanded = !expanded; drawList(); });
          list.appendChild(more);
        }
      };
      drawList();
    }

    /* ---- Bottom Navigation (Этап 1) ---- */
    function showTab(name) {
      document.querySelectorAll('.tab-page').forEach(p => p.classList.add('hidden'));
      const page = document.getElementById('tab-' + name);
      if (page) page.classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(b =>
        b.classList.toggle('tab-active', b.dataset.tab === name));
      window.scrollTo({ top: 0, behavior: 'smooth' });
      // График создаём лениво — только когда вкладка «Рынок» видна

        if (!liveState.chart && window.LightweightCharts) createLiveChart();
        else if (liveState.chart) liveState.chart.applyOptions({ width: document.getElementById('live-chart').clientWidth });
      }

    /* ---- Coin Chips (Этап 2): горизонтальная лента с живым индикатором ---- */
    function renderCoinChips(filter) {
      const wrap = document.getElementById('coin-chips');
      if (!wrap) return;
      const q = (filter || '').trim().toLowerCase();
      const items = COIN_LAUNCHES
        .map((c, i) => ({ ...c, i }))
        .filter(c => !q || c.symbol.toLowerCase().includes(q) || c.name.toLowerCase().includes(q));
      wrap.innerHTML = items.map(c => {
        const active = selectedCoin && selectedCoin.symbol === c.symbol;
        return `<button data-chip="${c.i}" class="chip shrink-0 ${active ? 'chip-active' : ''}">`
             + (active ? '<span class="live-dot"></span>' : '')
             + `${c.symbol}</button>`;
      }).join('');
      wrap.querySelectorAll('[data-chip]').forEach(b =>
        b.addEventListener('click', () => selectCoin(COIN_LAUNCHES[Number(b.dataset.chip)])));

    // Единая точка выбора монеты: чипсы, выпадающий список, натальная карта,
    // дата/время и живой график всегда синхронизированы
    function selectCoin(c) {
      selectedCoin = c;
      const sel = document.getElementById('coin-select');
      const idx = COIN_LAUNCHES.indexOf(c);
      if (sel && idx >= 0) sel.value = String(idx);
      document.getElementById('input-date').value = c.date;
      document.getElementById('input-time').value = c.time;
      const note = document.getElementById('coin-note');
      note.textContent = `${c.name}: ${t('ev.' + c.eventKey)}. ${t('ui.timeApprox')}`;
      note.classList.remove('hidden');
      // синхронизация с вкладкой «Рынок»
      liveState.symbol = binancePair(c.symbol);
      const lc = document.getElementById('live-coin');
      if (lc) lc.value = liveState.symbol;
      if (liveState.chart) loadLiveChart();
      renderCoinChips(document.getElementById('chip-filter').value);
      calculateAndRender();
    }

    function calculateAndRender() {
      const dateVal = document.getElementById('input-date').value;
      const timeVal = document.getElementById('input-time').value || '00:00';

      if (!dateVal) return;

      const [year, month, day] = dateVal.split('-').map(Number);
      const [hours, minutes] = timeVal.split(':').map(Number);
      const decimalHours = hours + minutes / 60.0;

      // Calculate Julian Day & Elapsed Days from J2000
      const jd = getJulianDay(year, month, day, decimalHours);
      const d = jd - 2451545.0;

      // Calculate longitudes
      const lons = getPlanetaryLongitudes(d);

      const planetResults = PLANET_METADATA.map((meta) => {
        const rawLon = lons[meta.id];
        const formatted = formatZodiac(rawLon);
        return {
          meta,
          ...formatted
        };
      });

      // Update Table
      const tbody = document.getElementById('planets-tbody');
      tbody.innerHTML = planetResults.map(p => `
        <tr class="hover:bg-purple-900/10 transition-colors">
          <td class="py-2.5 px-1 font-medium flex items-center space-x-1.5" style="color:${p.meta.color}">
            <span class="text-sm">${p.meta.symbol}</span>
            <span>${t(p.meta.key)}</span>
          </td>
          <td class="py-2.5 px-1 font-semibold" style="color:${p.sign.color}">
            ${p.sign.symbol} ${t(p.sign.key)}
          </td>
          <td class="py-2.5 px-1">${p.degrees}° ${p.minutes}'</td>
          <td class="py-2.5 px-1 text-right text-gray-400 font-mono text-[11px]">${p.raw.toFixed(2)}°</td>
        </tr>
      `).join('');

      // Update SVG Chart
      renderNatalChartSVG(planetResults);

      // Update Transits block
      const natalLabel = selectedCoin
        ? `${selectedCoin.symbol} \u2014 ${selectedCoin.name} \u00B7 ${dateVal} ${timeVal} UTC`
        : `${t('ui.manualChart')} ${dateVal} ${timeVal} UTC`;
      renderTransits(planetResults, natalLabel);
    }


    /* =========================================================================
       КАЛЕНДАРЬ ВОЛАТИЛЬНОСТИ: оценка на 30 дней вперёд
       Эвристика: лунные фазы (новолуние/полнолуние), жёсткие аспекты
       (соединение/квадрат/оппозиция) между планетами с весами «медленных»
       тел, ретроградность Меркурия и Марса.
       ========================================================================= */
    const CAL_I18N = {
      ru: {
        title: 'Календарь волатильности · 30 дней',
        sub: 'Эвристика: фазы Луны, аспекты планет, ретроградность · нажмите на день',
        weekdays: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'],
        low: 'Низкая', mod: 'Умеренная', high: 'Высокая', extreme: 'Экстремальная',
        score: 'индекс', sun: 'Солнце', moon: 'Луна', phase: 'Фаза Луны',
        retro: 'Ретроградны', allDirect: 'все планеты директны',
        aspects: 'Ключевые аспекты дня', noAspects: 'Точных жёстких аспектов нет — спокойный фон.',
        lum: 'освещ.'
      },
      en: {
        title: 'Volatility Calendar · 30 days',
        sub: 'Heuristics: Moon phases, planetary aspects, retrograde motion · tap a day',
        weekdays: ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'],
        low: 'Low', mod: 'Moderate', high: 'High', extreme: 'Extreme',
        score: 'index', sun: 'Sun', moon: 'Moon', phase: 'Moon phase',
        retro: 'Retrograde', allDirect: 'all planets direct',
        aspects: 'Key aspects of the day', noAspects: 'No exact hard aspects — calm background.',
        lum: 'illum.'
      }
    };

    function ct(path) {
      const get = (obj) => path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
      return get(CAL_I18N[lang]) ?? get(CAL_I18N.ru) ?? path;
    }

    const VOL_LEVELS = [
      { max: 3.0,  key: 'low',     color: '#10B981' },
      { max: 5.5,  key: 'mod',     color: '#F59E0B' },
      { max: 8.0,  key: 'high',    color: '#F97316' },
      { max: 1e9,  key: 'extreme', color: '#EF4444' }
    ];

    const VOL_WEIGHT = { sun: 1, moon: 1, mercury: 1, venus: 1, mars: 2,
                         jupiter: 1, saturn: 2.5, uranus: 2, neptune: 1.5, pluto: 3 };

    function moonEmoji(elong) {
      if (elong < 22.5 || elong >= 337.5) return '\u{1F311}';
      if (elong < 67.5)  return '\u{1F312}';
      if (elong < 112.5) return '\u{1F313}';
      if (elong < 157.5) return '\u{1F314}';
      if (elong < 202.5) return '\u{1F315}';
      if (elong < 247.5) return '\u{1F316}';
      if (elong < 292.5) return '\u{1F317}';
      return '\u{1F318}';
    }

    // Анализ одного дня: индекс волатильности + детали
    function analyzeDay(d) {
      const lons = getPlanetaryLongitudes(d);
      const prev = getPlanetaryLongitudes(d - 1);
      const ids = PLANET_METADATA.map(m => m.id);

      const retro = ids.filter(id => id !== 'sun' && id !== 'moon' &&
        norm360(lons[id] - prev[id]) > 180);

      let score = 0;
      const aspects = [];
      const HARD = [ { key: 'conj', sym: '\u260C', angle: 0 },
                     { key: 'sq',   sym: '\u25A1', angle: 90 },
                     { key: 'opp',  sym: '\u260D', angle: 180 } ];

      for (let i = 0; i < ids.length; i++) {
        for (let j = i + 1; j < ids.length; j++) {
          const dist = norm360(lons[ids[i]] - lons[ids[j]]);
          const diff = Math.min(dist, 360 - dist);
          HARD.forEach(a => {
            const orb = Math.abs(diff - a.angle);
            if (orb <= 5) {
              const w = VOL_WEIGHT[ids[j]] || 1; // медленная планета задаёт вес
              score += w * (1 - orb / 5);
              aspects.push({ fast: ids[i], slow: ids[j], key: a.key, sym: a.sym, orb });
            }
          });
        }
      }

      // Лунные фазы: новолуние и полнолуние — пики активности
      const elong = norm360(lons.moon - lons.sun);
      const dNew = Math.min(elong, 360 - elong);
      const dFull = Math.abs(elong - 180);
      if (dNew < 12 || dFull < 12) score += 2;
      else if (dNew < 25 || dFull < 25) score += 1;

      // Ретроградность Меркурия и Марса повышает нестабильность
      if (retro.includes('mercury')) score += 1;
      if (retro.includes('mars')) score += 1.5;

      aspects.sort((a, b) => a.orb - b.orb);
      return { score, aspects: aspects.slice(0, 6), retro, elong, lons };
    }

    function renderVolatilityCalendar() {
      document.getElementById('cal-title').textContent = ct('title');
      document.getElementById('cal-sub').textContent = ct('sub');

      // Легенда
      document.getElementById('cal-legend').innerHTML = VOL_LEVELS.map(l =>
        `<span class="px-2 py-0.5 rounded-full border text-[10px] font-medium"
               style="border-color:${l.color}55;color:${l.color};background:${l.color}11">${ct(l.key)}</span>`
      ).join('');

      const grid = document.getElementById('vol-calendar');
      const today = new Date();
      const days = [];
      for (let k = 0; k < 30; k++) {
        const date = new Date(today.getFullYear(), today.getMonth(), today.getDate() + k);
        const jd = getJulianDay(date.getFullYear(), date.getMonth() + 1, date.getDate(), 12);
        const a = analyzeDay(jd - 2451545.0);
        const level = VOL_LEVELS.find(l => a.score < l.max);
        days.push({ date, analysis: a, level, k });
      }

      // Заголовки недели (начало с понедельника)
      let html = ct('weekdays').map(w =>
        `<div class="text-center text-[10px] font-semibold text-purple-300/60 py-1">${w}</div>`).join('');

      // Пустые ячейки до первого дня
      const offset = (days[0].date.getDay() + 6) % 7;
      html += '<div></div>'.repeat(offset);

      html += days.map((d, idx) => `
        <button data-cal-idx="${idx}"
          class="cal-day aspect-square rounded-lg border flex flex-col items-center justify-center transition-transform active:scale-95 ${d.k === 0 ? 'ring-1 ring-cyan-400/70' : ''}"
          style="border-color:${d.level.color}44;background:${d.level.color}0d">
          <span class="text-[11px] font-bold" style="color:${d.level.color}">${d.date.getDate()}</span>
          <span class="text-[9px]">${moonEmoji(d.analysis.elong)}</span>
          <span class="text-[8px] text-gray-500">${d.analysis.score.toFixed(0)}</span>
        </button>`).join('');

      grid.innerHTML = html;

      grid.querySelectorAll('.cal-day').forEach(btn =>
        btn.addEventListener('click', () => showDayDetail(days[Number(btn.dataset.calIdx)])));
    }

    function showDayDetail(d) {
      const panel = document.getElementById('cal-detail');
      panel.classList.remove('hidden');
      const a = d.analysis;
      const loc = lang === 'ru' ? 'ru-RU' : 'en-GB';
      const dateStr = d.date.toLocaleDateString(loc, { weekday: 'long', day: 'numeric', month: 'long' });
      const sunSign = formatZodiac(a.lons.sun);
      const moonSign = formatZodiac(a.lons.moon);
      const illum = Math.round((1 - Math.cos(a.elong * D2R)) / 2 * 100);

      const aspectRows = a.aspects.length
        ? a.aspects.map(x => {
            const tone = t('tone.' + x.slow + '.' + x.key);
            const nuance = t('nuance.' + x.slow);
            return `<div class="flex items-start space-x-2 py-1 border-b border-purple-500/10 last:border-0">
              <span class="text-xs font-bold shrink-0 pt-0.5" style="color:${(PLANET_METADATA.find(m=>m.id===x.fast)||{}).color || '#fff'}">${t('planet.' + x.fast)}</span>
              <span class="text-sm shrink-0">${x.sym}</span>
              <span class="text-xs font-bold shrink-0 pt-0.5" style="color:${(PLANET_METADATA.find(m=>m.id===x.slow)||{}).color || '#fff'}">${t('planet.' + x.slow)}</span>
              <span class="text-[10px] text-gray-500 shrink-0 pt-1">${ct('score')} ${x.orb.toFixed(1)}°</span>
            </div>
            <p class="text-[11px] text-gray-300 leading-snug -mt-0.5 mb-1.5 pl-1">${tone} — ${nuance}.</p>`;
          }).join('')
        : `<p class="text-[11px] text-gray-500 py-1">${ct('noAspects')}</p>`;

      panel.innerHTML = `
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold capitalize">${dateStr}</span>
          <span class="px-2 py-0.5 rounded-full border text-[10px] font-semibold"
                style="border-color:${d.level.color}66;color:${d.level.color};background:${d.level.color}15">
            ${ct(d.level.key)} · ${ct('score')} ${a.score.toFixed(1)}
          </span>
        </div>
        <div class="grid grid-cols-2 gap-x-3 gap-y-1 text-[11px] text-gray-300 mb-2">
          <div>${ct('sun')}: <span style="color:${sunSign.sign.color}">${sunSign.sign.symbol} ${t(sunSign.sign.key)}</span></div>
          <div>${ct('moon')}: <span style="color:${moonSign.sign.color}">${moonSign.sign.symbol} ${t(moonSign.sign.key)}</span></div>
          <div class="col-span-2">${ct('phase')}: ${moonEmoji(a.elong)} ${t(moonPhaseName(a.elong).replace(/^\S+\s/, ''))} · ${ct('lum')} ${illum}%</div>
          <div class="col-span-2">${a.retro.length ? `\u21A9 ${ct('retro')}: ${a.retro.map(id => t('planet.' + id)).join(', ')}` : ct('allDirect')}</div>
        </div>
        <p class="text-[10px] uppercase tracking-wider text-purple-300/70 font-semibold mb-1">${ct('aspects')}</p>
        ${aspectRows}`;
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }


    /* =========================================================================
       ЖИВОЙ ГРАФИК: Binance public market data API
       - REST: исторические свечи + статистика 24ч (data-api.binance.vision,
         фолбэк api.binance.com), без ключа, CORS открыт
       - WebSocket: поток kline_<interval> (data-stream.binance.vision,
         фолбэк stream.binance.com:9443), обновление последней свечи ~250 мс
       ========================================================================= */
    const LIVE_I18N = {
      ru: {
        title: 'Живой график', price: 'Цена', chg: 'Изм. 24ч', high: 'Макс 24ч', low: 'Мин 24ч',
        loading: 'Загрузка…',
        err: 'Не удалось загрузить рыночные данные: проверьте сеть или попробуйте VPN (API Binance может быть заблокирован в вашем регионе).',
        iv: { '15m': '15м', '1h': '1ч', '4h': '4ч', '1d': '1д' }
      },
      en: {
        title: 'Live chart', price: 'Price', chg: '24h chg', high: '24h high', low: '24h low',
        loading: 'Loading…',
        err: 'Could not load market data: check your network or try a VPN (Binance API may be blocked in your region).',
        iv: { '15m': '15m', '1h': '1h', '4h': '4h', '1d': '1d' }
      }
    };
    function lt(path) {
      const get = (obj) => path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
      return get(LIVE_I18N[lang]) ?? get(LIVE_I18N.ru) ?? path;
    }

    const LIVE_INTERVALS = ['15m', '1h', '4h', '1d'];
    // Маркет-дата-only хосты Binance: не требуют ключ и работают в регионах,
    // где основной api.binance.com недоступен
    const BINANCE_REST_HOSTS = ['https://data-api.binance.vision', 'https://api.binance.com'];
    const BINANCE_WS_HOSTS = ['wss://data-stream.binance.vision/ws', 'wss://stream.binance.com:9443/ws'];
    // Монеты, у которых тикер на бирже отличается от привычного символа
    const PAIR_OVERRIDE = { USDT: 'USDCUSDT', MATIC: 'POLUSDT' };

    const liveState = {
      symbol: 'BTCUSDT', interval: '1h',
      chart: null, series: null, ws: null, wsHostIdx: 0
    };

    function binancePair(sym) { return PAIR_OVERRIDE[sym] || (sym + 'USDT'); }

    async function binanceFetch(path) {
      let lastErr;
      for (const host of BINANCE_REST_HOSTS) {
        try {
          const r = await fetch(host + path, { cache: 'no-store' });
          if (r.ok) return await r.json();
          lastErr = new Error('HTTP ' + r.status);
        } catch (e) { lastErr = e; }
      }
      throw lastErr;
    }

    function fmtPrice(p) {
      if (!isFinite(p)) return '—';
      if (p >= 1000) return p.toLocaleString('en-US', { maximumFractionDigits: 1 });
      if (p >= 1) return p.toFixed(p >= 100 ? 2 : 4);
      return p.toPrecision(4);
    }

    function setLiveStatus(txt) {
      const el = document.getElementById('live-status');
      if (!txt) { el.classList.add('hidden'); return; }
      el.textContent = txt;
      el.classList.remove('hidden');
    }

    function renderLiveSection() {
      document.getElementById('live-title').textContent = lt('title');
      document.getElementById('live-l-price').textContent = lt('price');
      document.getElementById('live-l-chg').textContent = lt('chg');
      document.getElementById('live-l-high').textContent = lt('high');
      document.getElementById('live-l-low').textContent = lt('low');

      // Переключатель таймфреймов
      const iv = document.getElementById('live-intervals');
      iv.innerHTML = LIVE_INTERVALS.map(i =>
        `<button data-iv="${i}" class="px-2.5 py-2 transition-colors ${liveState.interval === i ? 'bg-purple-600/40 text-white' : 'text-purple-300'}">${lt('iv.' + i)}</button>`
      ).join('');
      iv.querySelectorAll('button').forEach(b =>
        b.addEventListener('click', () => {
          if (liveState.interval === b.dataset.iv) return;
          liveState.interval = b.dataset.iv;
          renderLiveSection();
          loadLiveChart();
        }));

      // Селектор монет (те же, что в натальных картах)
      const sel = document.getElementById('live-coin');
      if (!sel.dataset.bound) {
        sel.innerHTML = COIN_LAUNCHES.map(c => {
          const pair = binancePair(c.symbol);
          const quote = pair.endsWith('USDT') ? 'USDT' : pair.replace(c.symbol.replace('MATIC','POL'), '');
          return `<option value="${pair}">${c.symbol} / ${quote}</option>`;
        }).join('');
        sel.value = liveState.symbol;
        sel.addEventListener('change', () => { liveState.symbol = sel.value; loadLiveChart(); });
        sel.dataset.bound = '1';
      }

      if (!window.LightweightCharts) setLiveStatus(lt('err'));
      // график создаётся лениво при первом открытии вкладки «Рынок» (showTab)
    }

    function createLiveChart() {
      const el = document.getElementById('live-chart');
      el.innerHTML = '';
      const chart = LightweightCharts.createChart(el, {
        layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#94A3B8', fontSize: 10 },
        grid: { vertLines: { color: 'rgba(139,92,246,0.07)' }, horzLines: { color: 'rgba(139,92,246,0.07)' } },
        timeScale: { borderColor: 'rgba(139,92,246,0.3)', timeVisible: true, secondsVisible: false },
        rightPriceScale: { borderColor: 'rgba(139,92,246,0.3)' },
        crosshair: { mode: 0 }
      });
      liveState.chart = chart;
      liveState.series = chart.addCandlestickSeries({
        upColor: '#10B981', downColor: '#EF4444',
        wickUpColor: '#10B981', wickDownColor: '#EF4444', borderVisible: false
      });
      new ResizeObserver(() => chart.applyOptions({ width: el.clientWidth, height: el.clientHeight })).observe(el);
      loadLiveChart();
    }

    async function loadLiveChart() {
      const st = liveState;
      try {
        setLiveStatus(null);
        const [klines, ticker] = await Promise.all([
          binanceFetch(`/api/v3/klines?symbol=${st.symbol}&interval=${st.interval}&limit=300`),
          binanceFetch(`/api/v3/ticker/24hr?symbol=${st.symbol}`)
        ]);
        const candles = klines.map(k => ({
          time: Math.floor(k[0] / 1000),
          open: +k[1], high: +k[2], low: +k[3], close: +k[4]
        }));
        const p = candles[candles.length - 1].close;
        const dec = p >= 100 ? 2 : p >= 1 ? 4 : 8;
        st.series.applyOptions({ priceFormat: { type: 'price', precision: dec, minMove: Math.pow(10, -dec) } });
        st.series.setData(candles);
        st.chart.timeScale().fitContent();

        document.getElementById('live-price').textContent = fmtPrice(+ticker.lastPrice);
        const chg = +ticker.priceChangePercent;
        const chgEl = document.getElementById('live-chg');
        chgEl.textContent = (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';
        chgEl.style.color = chg >= 0 ? '#10B981' : '#EF4444';
        document.getElementById('live-high').textContent = fmtPrice(+ticker.highPrice);
        document.getElementById('live-low').textContent = fmtPrice(+ticker.lowPrice);
        connectLiveWS();
      } catch (e) {
        setLiveStatus(lt('err'));
      }
    }

    function connectLiveWS() {
      const st = liveState;
      if (st.ws) { try { st.ws.onclose = null; st.ws.close(); } catch (e) {} }
      const host = BINANCE_WS_HOSTS[st.wsHostIdx % BINANCE_WS_HOSTS.length];
      const ws = new WebSocket(`${host}/${st.symbol.toLowerCase()}@kline_${st.interval}`);
      ws.onmessage = ev => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        const k = msg.k;
        if (!k || !st.series) return;
        st.series.update({
          time: Math.floor(k.t / 1000),
          open: +k.o, high: +k.h, low: +k.l, close: +k.c
        });
        if (k.x) { // свеча закрылась — обновим статистику 24ч
          binanceFetch(`/api/v3/ticker/24hr?symbol=${st.symbol}`).then(ticker => {
            const chg = +ticker.priceChangePercent;
            const chgEl = document.getElementById('live-chg');
            chgEl.textContent = (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';
            chgEl.style.color = chg >= 0 ? '#10B981' : '#EF4444';
            document.getElementById('live-high').textContent = fmtPrice(+ticker.highPrice);
            document.getElementById('live-low').textContent = fmtPrice(+ticker.lowPrice);
          }).catch(() => {});
        }
        const priceEl = document.getElementById('live-price');
        priceEl.textContent = fmtPrice(+k.c);
        priceEl.style.color = +k.c >= +k.o ? '#10B981' : '#EF4444';
      };
      ws.onclose = () => {
        // фолбэк на другой хост и переподключение
        setTimeout(() => {
          if (liveState.ws === ws) { liveState.wsHostIdx++; connectLiveWS(); }
        }, 4000);
      };
      ws.onerror = () => ws.close();
      st.ws = ws;
    }

    // Set Default Values on Load (Current Date & Time)
    window.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      const yr = now.getFullYear();
      const mo = String(now.getMonth() + 1).padStart(2, '0');
      const da = String(now.getDate()).padStart(2, '0');
      const hr = String(now.getHours()).padStart(2, '0');
      const mi = String(now.getMinutes()).padStart(2, '0');

      document.getElementById('input-date').value = `${yr}-${mo}-${da}`;
      document.getElementById('input-time').value = `${hr}:${mi}`;

      initLang();
      populateCoinSelect();

      // Обработчики вешаем до первого расчёта, чтобы UI не «умирал» при любой ошибке движка
      document.getElementById('calc-btn').addEventListener('click', calculateAndRender);
      document.getElementById('lang-ru').addEventListener('click', () => setLang('ru'));
      document.getElementById('lang-en').addEventListener('click', () => setLang('en'));

      calculateAndRender();
      renderVolatilityCalendar();
      renderLiveSection();
      renderCoinChips();

      // Bottom Navigation
      document.querySelectorAll('.tab-btn').forEach(b =>
        b.addEventListener('click', () => showTab(b.dataset.tab)));

      // Поиск по чипсам (Progressive Disclosure)
      const chipFilter = document.getElementById('chip-filter');
      chipFilter.placeholder = t('ui.searchPh');
      document.getElementById('search-btn').addEventListener('click', () => {
        chipFilter.classList.toggle('hidden');
        if (!chipFilter.classList.contains('hidden')) chipFilter.focus();
      });
      chipFilter.addEventListener('input', e => renderCoinChips(e.target.value));

      // «Настройки»: показ/скрытие таблицы положений планет
      document.getElementById('settings-btn').addEventListener('click', () =>
        document.getElementById('positions-section').classList.toggle('hidden'));
    });
  </script>
</body>
</html>
